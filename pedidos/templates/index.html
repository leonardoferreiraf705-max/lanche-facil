<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Lanche Fácil</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff3e0;
            margin: 0;
        }

        header {
            background: #ff7b00;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            font-size: 38px;
            margin: 0;
        }

        main {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
        }

        h2 {
            color: #e65100;
        }

        .cardapio {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .produto {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 3px 8px #ccc;
            transition: 0.3s;
            text-align: center;
        }

        .produto:hover {
            transform: translateY(-7px) scale(1.02);
            box-shadow: 0 8px 18px #bbb;
        }

        .emoji {
            font-size: 40px;
        }

        .preco {
            color: green;
            font-weight: bold;
        }

        .pedido {
            background: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 8px #ccc;
        }

        input {
            padding: 12px;
            width: 90%;
            border: 1px solid #ff7b00;
            border-radius: 6px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #ff7b00;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #e65100;
            transform: scale(1.08);
        }

        button:active {
            transform: scale(0.95);
        }

        footer {
            background: #e65100;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .cardapio {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🍔 Lanche Fácil</h1>
        <p>Sistema de pedidos</p>
    </header>

    <main class="container">

        <h2>🍟 Cardápio</h2>

        <div class="cardapio">

            <div class="produto">
                <div class="emoji">🍔</div>
                <h3>Hambúrguer</h3>
                <p class="preco">R$ 13,00</p>
            </div>

            <div class="produto">
                <div class="emoji">🥪</div>
                <h3>X-Salada</h3>
                <p class="preco">R$ 15,00</p>
            </div>

            <div class="produto">
                <div class="emoji">🍟</div>
                <h3>Batata Frita</h3>
                <p class="preco">R$ 8,00</p>
            </div>

            <div class="produto">
                <div class="emoji">🥤</div>
                <h3>Refrigerante</h3>
                <p class="preco">R$ 5,00</p>
            </div>

        </div>

        <div class="pedido">

            <h2>🛒 Faça seu pedido</h2>

            <label>Nome do cliente:</label>

            <br><br>

            <input
                type="text"
                id="nomeCliente"
                placeholder="Digite seu nome"
            >

            <br>

            <button onclick="finalizarPedido()">
                Finalizar pedido
            </button>

        </div>

    </main>

    <footer>
        🍔 Lanche Fácil — Sistema de pedidos
    </footer>

    <script>
        function finalizarPedido() {

            let nome = document.getElementById("nomeCliente").value;

            if (nome === "") {

                alert("Digite seu nome para finalizar o pedido!");

            } else {

                alert("Pedido realizado com sucesso, " + nome + "!");
            }
        }
    </script>

</body>

</html>
