<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excluir Pedido - Lanche Fácil</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            🍔 Lanche Fácil
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body p-4 text-center">

            <h2 class="text-danger mb-3">⚠️ Excluir Pedido</h2>

            <p>
                Tem certeza que deseja excluir este pedido?
            </p>

            <p>
                <strong>Cliente:</strong> {{ pedido.cliente.nome }}<br>
                <strong>Produto:</strong> {{ pedido.produto.nome }}<br>
                <strong>Quantidade:</strong> {{ pedido.quantidade }}<br>
                <strong>Valor:</strong> R$ {{ pedido.valor_total }}
            </p>

            <form method="POST" onsubmit="return confirmarExclusao();">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Sim, excluir
                </button>

                <a href="{% url 'lista_pedidos' %}" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

<script>
function confirmarExclusao() {
    return confirm("Tem certeza que deseja excluir este pedido?");
}
</script>

</body>
</html>
